name: ci

on:
  push:
  pull_request:

# Supply chain: deny all permissions by default; each job declares what it needs.
permissions: {}

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --package project-backend --extra dev
      - run: make check-toolchain check-gate check-contract check-breaking check-generated check-docs check-specs

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://project:ci-pw@localhost:5432/project_test
      DATABASE_URL: postgresql+asyncpg://project:ci-pw@localhost:5432/project_test
      # begin capability:redis
      REDIS_URL: redis://localhost:6379/0
      # end capability:redis
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: ci-pw
          POSTGRES_DB: project_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U project"
          --health-interval 10s --health-timeout 5s --health-retries 5
      # begin capability:redis
      redis:
        image: redis:7-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      # end capability:redis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --package project-backend --extra dev
      - run: make lint-py typecheck-py test-unit-py check-architecture check-counterexamples test-integration test-contract test-migrations test-security

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-ts typecheck-ts test-unit-ts build-clients

  # begin client:mobile-flutter
  dart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .flutter-version
          cache: true
      - run: make check-dart
  # end client:mobile-flutter

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make test-e2e

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # begin template-only
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --package project-backend --extra dev
      - run: make check-generator
      # end template-only
      - run: make images
      - run: make scan-images
      - run: make sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom-backend.spdx.json
