[project]
name = "project-backend"
version = "0.1.0"
description = "Headless backend: all business logic lives here (blueprint 04)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.19.0", # sqlite driver for the mutation harness (tests only)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure logic, no I/O (tests/modules/*/unit)",
    "api: HTTP layer tests (tests/modules/*/api)",
    "integration: real DB/adapters (tests/integration, tests/modules/*/integration)",
    "contract: live interface vs contracts/ (tests/contract)",
    "security: authn/authz (tests/security)",
    "migration: alembic upgrade/downgrade (tests/migrations)",
    "architecture: import/boundary rules (tests/architecture)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated contract code is byte-compared by make check-generated;
# never reformat it.
exclude = ["**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

# B008 (function call in default arg) is the documented FastAPI Depends pattern:
# the Depends object is intentionally constructed once at def time.
[tool.ruff.lint.per-file-ignores]
"src/project_backend/**/presentation/**/*.py" = ["B008"]
"src/project_backend/platform/http/deps.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["project_backend"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
