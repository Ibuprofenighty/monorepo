# App gateway: static SPA + /api proxy (blueprint 09 §6).
# /api is NEVER rewritten to index.html; upstream Problem responses keep
# their status code and content type.
upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    include snippets/security-headers.conf;

    # API: proxy with buffering tuned for JSON (not streams).
    location /api/ {
        include snippets/proxy.conf;
        proxy_pass http://api_upstream;
    }

    # SPA static assets: long cache, immutable.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: only for non-API, non-asset paths.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
