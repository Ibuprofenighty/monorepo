# Baseline security headers. Identity/authz stay server-side (09 §6).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS: only effective over HTTPS. Enable when TLS is terminated here;
# if TLS is terminated at a load balancer, set HSTS there instead.
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# CSP for the static SPA: no inline scripts/styles, API calls to same origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
