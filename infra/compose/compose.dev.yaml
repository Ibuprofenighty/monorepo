# Dev overlay: source mounts, reload, exposed debug ports.
services:
  api:
    command: ["uvicorn", "project_backend.entrypoints.http:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../../apps/backend/src:/srv/app/src:ro
      - ../../contracts:/srv/app/contracts:ro
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev

  # begin capability:worker
  worker:
    environment:
      APP_ENV: dev
  # end capability:worker

  postgres:
    ports:
      - "5432:5432"

  # begin capability:redis
  redis:
    ports:
      - "6379:6379"
  # end capability:redis
